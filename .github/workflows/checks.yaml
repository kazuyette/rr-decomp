name: checks

# Ce qui peut réellement tourner en intégration continue.
#
# Presque rien dans ce dépôt ne se construit sans une copie du jeu, qui n'a
# évidemment pas sa place ici : `make all` a besoin de `asm/`, qui a besoin de
# `PSX.EXE`. La construction complète est donc déclenchée à la main, par
# quelqu'un qui possède le jeu (voir build.yaml).
#
# Deux choses échappent à cette contrainte, et elles ne sont pas les moins
# utiles : le contrôle du GTE, qui compare deux transcriptions indépendantes
# d'une documentation matérielle sur 11 600 états, et la simple vérification
# que les outils s'analysent. Les faire tourner à chaque poussée attrape ce
# qu'on casse le plus souvent -- une faute de frappe dans une saturation, un
# décalage inversé, un fichier qui ne compile plus.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gte:
    name: le GTE contre sa seconde transcription
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 11 600 comparaisons, 29 encodages
        run: python3 tools/m0/gte_check.py

  outils:
    name: les outils s'analysent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: compilation des sources Python
        run: python3 -m compileall -q tools/
      - name: le banc natif compile
        # game.c et table.c manquent forcement ici -- on ne compile donc que
        # ce qui ne depend pas du jeu, ce qui suffit a attraper une faute de
        # frappe dans le modele du materiel.
        run: |
          for f in tools/m0/hw.c tools/m0/gpu.c tools/m0/gte.c; do
            gcc -c -O1 -w -I tools/m0 -o /dev/null "$f"
          done
