name: checks

# What can actually run in continuous integration.
#
# Almost nothing in this repository builds without a copy of the game, which
# obviously has no place here: `make all` needs `asm/`, which needs
# `PSX.EXE`. The full build is therefore triggered by hand, by someone who
# owns the game (see build.yaml).
#
# Two things escape that constraint, and they are not the least useful ones:
# the GTE check, which compares two independent transcriptions of a hardware
# document over 11,600 states, and the simple verification that the tools
# parse. Running them on every push catches what we break most often -- a
# typo in a saturation, a flipped shift, a file that no longer compiles.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gte:
    name: the GTE against its second transcription
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 11,600 comparisons, 29 encodings
        run: python3 tools/m0/gte_check.py

  tools:
    name: the tools parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python sources compile
        run: python3 -m compileall -q tools/
      - name: the native bench compiles
        # game.c and table.c are necessarily missing here -- so we only
        # compile what does not depend on the game, which is enough to catch a
        # typo in the hardware model.
        run: |
          for f in tools/m0/hw.c tools/m0/gpu.c tools/m0/gte.c; do
            gcc -c -O1 -w -I tools/m0 -o /dev/null "$f"
          done
