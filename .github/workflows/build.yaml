name: build

# Triggered by hand, and only by hand.
#
# This build needs `asm/`, which needs PSX.EXE, which has no place in this
# repository. On a continuous integration machine it therefore always fails
# -- and a CI that always fails no longer tells anyone anything. It stays
# here because it documents exactly how to build, and because someone who
# owns the game can run it on their own fork after dropping the executable
# in.
#
# What runs on every push is in checks.yaml: the GTE check, which asks
# nothing of the game.
on:
  workflow_dispatch:

env:
  # This build (Nov 1994, Japan) has no SYSTEM.CNF / product serial on the
  # disc, so there's no official catalog number to key off. We use the
  # executable's own name as the version identifier instead.
  VERSION: PSX.EXE
  OBJDIFF_VERSION: v3.8.0

jobs:
  build:
    runs-on: ubuntu-latest
    # Pre-built toolchain (old GCC 2.7.2 PSX target + binutils-mipsel + python)
    # from docker/toolchain.Dockerfile, published by .github/workflows/docker.yaml.
    # Avoids rebuilding GCC from source on every push.
    container:
      image: ghcr.io/${{ github.repository }}-toolchain:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build target + base objects
        run: make all PSX_GCC_DIR=/opt/psx-gcc

      - name: Download objdiff-cli
        run: |
          curl -sL -o objdiff-cli \
            "https://github.com/encounter/objdiff/releases/download/${OBJDIFF_VERSION}/objdiff-cli-linux-x86_64"
          chmod +x objdiff-cli

      - name: Generate objdiff report
        run: ./objdiff-cli report generate -o build/report.json

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.VERSION }}_report
          path: build/report.json
          if-no-files-found: error
